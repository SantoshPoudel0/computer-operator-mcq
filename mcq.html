ds running programs. States: new, ready, running, waiting, terminated; Example – Task Manager"},{"q":"For “Security”, which is the correct “What it does”?","o":["Provides CLI or GUI","Passwords, user accounts, permissions","Creates, names, stores, secures, copies and deletes files and folders","Records resource use by users"],"a":1,"e":"Security: What it does – Passwords, user accounts, permissions; Example – Login, NTFS permissions"},{"q":"Which “CLI (Command Line Interface)” fits this: Windows desktop, macOS","o":["Light on resources","Type text commands","MS-DOS, Command Prompt, Linux terminal","Needs commands to be remembered"],"a":2,"e":"MS-DOS, Command Prompt, Linux terminal: GUI (Graphical User Interface) – Windows desktop, macOS"},{"q":"For “Job accounting”, which is the correct “Example”?","o":["Logs","Task Manager","Print queue","Command Prompt, desktop"],"a":0,"e":"Job accounting: What it does – Records resource use by users; Example – Logs"},{"q":"For “Job accounting”, which is the correct “What it does”?","o":["Allocates RAM to programs and frees it; uses virtual memory (disk used as extra RAM)","Provides CLI or GUI","Creates, names, stores, secures, copies and deletes files and folders","Records resource use by users"],"a":3,"e":"Job accounting: What it does – Records resource use by users; Example – Logs"},{"q":"For “Light on resources”, which is the correct “GUI (Graphical User Interface)”?","o":["Easier for beginners","Click icons, windows and menus","Windows desktop, macOS","Needs more memory"],"a":3,"e":"Light on resources: GUI (Graphical User Interface) – Needs more memory"},{"q":"For “User interface”, which is the correct “What it does”?","o":["Provides CLI or GUI","Records resource use by users","Allocates RAM to programs and frees it; uses virtual memory (disk used as extra RAM)","Passwords, user accounts, permissions"],"a":0,"e":"User interface: What it does – Provides CLI or GUI; Example – Command Prompt, desktop"},{"q":"For “Process managem  document.getElementById('score').textContent=c+'/'+a+' correct'}
function tstat(ui,ti){const t=D[ui].topics[ti];let a=0,c=0;t.qs.forEach((q,qi)=>{const v=S[ui+'.'+ti+'.'+qi];if(v!=null){a++;if(v==q.a)c++}});return[a,c,t.qs.length]}
